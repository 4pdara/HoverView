name: Publish HoverView release
on:
  push:
    branches: [main]
    paths:
      - extension/**
      - scripts/**
      - releases/**
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hoverview-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build installable ZIP
        run: python3 scripts/package.py
      - name: Verify before publishing
        run: npm test
      - name: Publish a new manifest version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./extension/manifest.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keep its published assets unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            "artifacts/hoverview-v${VERSION}.zip" \
            artifacts/hoverview.zip artifacts/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "HoverView $TAG" \
            --notes-file "releases/${TAG}.md" --latest
