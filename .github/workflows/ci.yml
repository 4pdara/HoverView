name: Check HoverView
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build installable ZIP
        run: python3 scripts/package.py
      - name: Test extension and validate website
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: hoverview-installable
          path: artifacts/*
          if-no-files-found: error
